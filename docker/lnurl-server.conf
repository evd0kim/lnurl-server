[program:lnurl-server]
command=/usr/local/bin/lnurl-server
    --node-backend=phoenixd
    --phoenixd-url=http://127.0.0.1:9740
    --phoenixd-api-key=%(ENV_PHOENIXD_API_PASSWORD)s
    --domain=%(ENV_LNURL_DOMAIN)s
    --data-dir=/app/data
    --bind=0.0.0.0
    --port=3000
    --min-sendable=1000
    --max-sendable=21000000000
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/lnurl-server.log
stderr_logfile=/var/log/supervisor/lnurl-server_err.log
user=root
environment=
    RUST_LOG=%(ENV_RUST_LOG)s,
    LNURL_NODE_BACKEND=phoenixd,
    LNURL_PHOENIXD_URL=http://127.0.0.1:9740,
    LNURL_PHOENIXD_API_KEY=%(ENV_PHOENIXD_API_PASSWORD)s,
    LNURL_DOMAIN=%(ENV_LNURL_DOMAIN)s,
    LNURL_DATA_DIR=/app/data,
    LNURL_BIND=0.0.0.0,
    LNURL_PORT=3000,
    LNURL_MIN_SENDABLE=1000,
    LNURL_MAX_SENDABLE=21000000000
